name: release

# Tag-triggered distribution builds (spec #92, ticket #98).
#
# A tag alone names the release: `vX.Y.Z` is the stable channel,
# `vX.Y.Z-<prerelease>` (for example `v0.1.0-rc.1`) is the prerelease channel.
# The tag -> version/channel rule, the release index merge, the artifact
# layout/reproducibility checks and the runtime layout all live in testable
# Python (`hostrun/release.py`, `scripts/*.py`); this file only wires them
# together.  workflow_dispatch is a dry run by default: it builds and verifies
# but creates no Release and commits nothing.
#
# The release index `releases/index.json` is the repository's record of
# published artifacts.  After a successful build and Release, the workflow
# resolves the tag commit once, then makes at most two attempts.  Each attempt
# fetches and hard-resets to `origin/main`, regenerates the index entry, checks
# that the tag commit is still an ancestor of `origin/main`, commits as
# `github-actions[bot]` and pushes; a rejected push therefore retries from a
# clean origin/main base, never on top of the rejected local commit.  If branch
# protection still blocks the token, the job fails with the Release URL and says
# the index must be updated manually.  The resulting index is also uploaded as a
# Release asset.
#
# Actions are pinned by major tag for readability.  SHA-pinning (a full commit
# SHA per action) is a follow-up only if repository policy requires it.

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to dry-run, e.g. v0.1.0 or v0.1.0-rc.1"
        required: true
        type: string
      channel:
        description: "Optional channel; when set it must agree with the tag"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build and verify only; do not create a Release or commit the index"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  # Pinned independently of the runner and of requirements.txt: the bundled
  # runtime must be reproducible, so CI never takes the runner's interpreter.
  PYTHON_EMBED_VERSION: "3.13.7"
  RELEASE_INDEX: "releases/index.json"
  DIST_DIR: "dist"
  DIST_REPRO_DIR: "dist-repro"
  RUNTIME_DIR: "runtime"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Derive version and channel from the tag
        id: release
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          $tagArgs = @("-m", "hostrun.release", "tag", "--tag", $tag, "--github-output", $env:GITHUB_OUTPUT)
          $channel = "${{ inputs.channel }}"
          if ($channel) { $tagArgs += @("--channel", $channel) }
          python @tagArgs
          if ($LASTEXITCODE -ne 0) { throw "tag '$tag' did not resolve to a version and channel" }

      - name: Download the pinned embeddable runtime and dependency wheels
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/$env:PYTHON_EMBED_VERSION/python-$env:PYTHON_EMBED_VERSION-embed-amd64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          if (-not (Test-Path python-embed.zip)) { throw "CPython embeddable zip download failed: $url" }
          python -m pip download --only-binary=:all: --dest wheels -r requirements-release.txt
          if ($LASTEXITCODE -ne 0) { throw "pinned wheel download failed; see requirements-release.txt" }

      - name: Assemble the bundled runtime
        shell: pwsh
        run: |
          python scripts/prepare_runtime.py --embed-zip python-embed.zip --wheels wheels --out $env:RUNTIME_DIR --python-version $env:PYTHON_VERSION --require-module yaml --require-module fitz
          if ($LASTEXITCODE -ne 0) { throw "runtime assembly failed; the embeddable zip or a wheel is missing or malformed" }

      - name: Build twice and prove the artifact digest is reproducible
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          python -m hostrun.distribution --source . --out $env:DIST_DIR --version $version --channel $channel --built-from-commit ${{ github.sha }} --runtime-dir $env:RUNTIME_DIR --os windows --arch x86_64 --python 3.13 --dsh '*'
          if ($LASTEXITCODE -ne 0) { throw "first distribution build failed" }
          python -m hostrun.distribution --source . --out $env:DIST_REPRO_DIR --version $version --channel $channel --built-from-commit ${{ github.sha }} --runtime-dir $env:RUNTIME_DIR --os windows --arch x86_64 --python 3.13 --dsh '*'
          if ($LASTEXITCODE -ne 0) { throw "second distribution build failed" }
          python -m hostrun.release verify-artifact --zip "$env:DIST_DIR/frontier-$version-$channel.zip"
          if ($LASTEXITCODE -ne 0) { throw "artifact layout verification failed: runtime/ or bin/frontier.cmd is missing" }
          python -m hostrun.release check-reproducible --first-dir $env:DIST_DIR --second-dir $env:DIST_REPRO_DIR --version $version --channel $channel
          if ($LASTEXITCODE -ne 0) { throw "the same tag metadata did not produce the same artifact sha256" }

      # Spec #92 testing seam 5: the released zip must install and report as a
      # package installation on a clean runner.  The runner's Python only runs
      # the CLI; the point is the installed tree under the temporary code dir.
      - name: Smoke-test installing the built package into a clean code directory
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          $zip = "$env:DIST_DIR/frontier-$version-$channel.zip"
          $smoke = Join-Path $env:RUNNER_TEMP "install-smoke"
          $dsh = Join-Path $smoke "dsh.cmd"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Set-Content -Path $dsh -Value "@echo off`r`nexit /b 0" -Encoding ascii
          python scripts/ci_install_smoke.py --zip $zip --code (Join-Path $smoke "code") --archive (Join-Path $smoke "archive") --dsh $dsh --skills-target (Join-Path $smoke "host-skills/frontier-run") --bootstrap (Join-Path $smoke "bootstrap")
          if ($LASTEXITCODE -ne 0) { throw "the built artifact failed the install smoke test; the JSON above names the failing step" }

      - name: Render release notes
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          python -m hostrun.release notes --tag "${{ steps.release.outputs.tag }}" --digest "$env:DIST_DIR/frontier-$version-$channel.digest.json" --out release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "release notes rendering failed" }

      - name: Create stable release
        if: "${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && steps.release.outputs.channel == 'stable' }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          $tag = "${{ steps.release.outputs.tag }}"
          gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --title "frontier $version ($channel)" --notes-file release-notes.md "$env:DIST_DIR/frontier-$version-$channel.zip" "$env:DIST_DIR/frontier-$version-$channel.digest.json" "$env:DIST_DIR/frontier-$version-$channel/manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed for $tag" }

      - name: Create prerelease
        if: "${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && steps.release.outputs.channel == 'prerelease' }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          $tag = "${{ steps.release.outputs.tag }}"
          gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --prerelease --title "frontier $version ($channel)" --notes-file release-notes.md "$env:DIST_DIR/frontier-$version-$channel.zip" "$env:DIST_DIR/frontier-$version-$channel.digest.json" "$env:DIST_DIR/frontier-$version-$channel/manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed for $tag" }

      - name: Update the release index and commit it to main
        if: "${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $releaseUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$tag"
          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:sszzz")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The tagged commit is fixed evidence about the artifact, so resolve it
          # exactly once.  Resolving it inside the loop would make attempt 2
          # compare the rejected local index commit (HEAD), not the tag.
          $tagCommit = (git rev-parse "refs/tags/$tag^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) { throw "could not resolve the commit for release tag $tag" }
          $pushed = $false
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw "could not fetch origin main" }
            # Every attempt starts from a clean origin/main.  A rejected push must
            # never retry on top of the local commit it just failed to push.
            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw "could not reset the checkout to origin/main" }
            python scripts/update_release_index.py --index $env:RELEASE_INDEX --digest "$env:DIST_DIR/frontier-$version-$channel.digest.json" --release-url $releaseUrl --published-at $publishedAt
            if ($LASTEXITCODE -ne 0) { throw "release index update failed" }
            git merge-base --is-ancestor $tagCommit origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "the release tag commit $tagCommit is not on main's history; the index was not committed. Merge it into main and rerun."
            }
            git add $env:RELEASE_INDEX
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host "release index already up to date"; $pushed = $true; break }
            git commit -m "chore(release): record $tag in the release index"
            if ($LASTEXITCODE -ne 0) { throw "could not commit the release index" }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "push attempt $attempt was rejected; retrying once from a clean origin/main"
          }
          if (-not $pushed) {
            throw "could not commit the release index to main after two attempts (branch protection or a persistent race). The GitHub Release exists at $releaseUrl; update releases/index.json manually."
          }

      - name: Upload the release index as a release asset
        if: "${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          gh release upload $tag $env:RELEASE_INDEX --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not upload the release index asset" }
